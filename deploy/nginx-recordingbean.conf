# Dedicated vhost; existing server blocks and applications remain unchanged.
limit_req_zone $binary_remote_addr zone=recordingbean_requests:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=recordingbean_connections:10m;
server {
    listen 80;
    server_name recorder.example.com;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/lib/recordingbean-acme; }
    location / { return 308 https://recorder.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name recorder.example.com;
    ssl_certificate /etc/letsencrypt/live/recorder.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recorder.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 5m;
    client_body_timeout 60s;
    limit_conn recordingbean_connections 12;
    limit_req zone=recordingbean_requests burst=40 nodelay;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host recorder.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 100s;
    }
}
